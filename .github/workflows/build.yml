name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: |
          set +e
          gradle assembleDebug —console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(tail -n 40 build.log | sed ‘s/%/%25/g’ | awk ‘{printf “%s%%0A”, $0}’)
            echo “::error title=GradleLog::$msg”
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleLauncher-apk
          path: app/build/outputs/apk/debug/app-debug.apk
